<!DOCTYPE html>
<html>
<head>
    <title>Earthquake Shelter Locator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Earthquake Shelter Locator</h1>

    <div class="card">
        <h2>Earthquake Information</h2>

        <p id="magnitude">Magnitude: --</p>
        <p id="location">Location: --</p>
        <p id="latitude">Latitude: --</p>
        <p id="longitude">Longitude: --</p>
        <p id="time">Time: --</p>
    </div>

    <div class="card">
        <h2>Nearby Shelters</h2>

        <table>
            <thead>
                <tr>
                    <th>Shelter Name</th>
                    <th>Distance (mi)</th>
                </tr>
            </thead>

            <tbody id="shelterTable">
                <tr>
                    <td>Waiting for data...</td>
                    <td>-</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div>
        <form id="location">
            <label for="latitude">Latitude:</label>
            <input type="text" id="latitude" name="latitude" placeholder="">
            <label for="longitude">Longitude:</label>
            <input type="text" id="longitude" name="longitude" placeholder="">
        </form>

        <button id="submitLocation">Submit</button>
    </div>

    <link href="https://unpkg.com/tabulator-tables/dist/css/tabulator.min.css" rel="stylesheet">

    <script src="https://unpkg.com/tabulator-tables/dist/js/tabulator.min.js"></script>

    <div id="earthquake-table"></div>

    <div id="shelter-table"></div>

    <button id="refreshButton">
        Refresh Data
    </button>

    <script src="script.js"></script>
</body>
</html>
