<!DOCTYPE html>
<html>
<head>
    <title>Earthquake Shelter Locator</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <link href="https://unpkg.com/tabulator-tables/dist/css/tabulator.min.css" rel="stylesheet">
</head>
<body>

    <h1>Earthquake Shelter Locator</h1>
    <div class="container">
        <div id="map"></div>

        <div id="sidebar">
            <!-- USER LOCATION -->
            <div class="sidebar-section">
                <h3>Your Location</h3>
                <div>
                    <label for="submitLatitude">Latitude:</label>
                    <input type="text" id="submitLatitude" name="submitLatitude" placeholder="eg. 34.0">
                    <label for="submitLongitude">Longitude:</label>
                    <input type="text" id="submitLongitude" name="submitLongitude" placeholder="ef. -87.0">

                    <button id="submitLocation">Submit</button>
                </div>
            </div>

            <hr>

            <!-- TABLE SELECTION -->
            <div class="sidebar-section">
                <h3>Data Table</h3>

                <label for="table-select">Select Data</label>
                <select id="table-select">
                    <option value="shelters">Shelters</option>
                    <option value="earthquakes">Earthquakes</option>
                </select>
            </div>

            <!-- SORTING -->
            <div class="sidebar-section">
                <h3>Sort Data</h3>

                <label for="sort-select">Sort By</label>
                <select id="sort-select">
                    <!-- JavaScript populates these options -->
                </select>
            </div>

            <div id="shelter-table-container">
                <div id="shelter-table"></div>
            </div>

            <div id="earthquake-table-container" style="display: none;">
                <div id="earthquake-table"></div>
            </div>
        </div>
    </div>

    <button id="refreshButton">
        Refresh Data
    </button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/tabulator-tables/dist/js/tabulator.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
