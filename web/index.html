<!DOCTYPE html>
<html>
<head>
    <title>Earthquake Shelter Locator</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.2/dist/leaflet.css">
    <link href="https://unpkg.com/tabulator-tables/dist/css/tabulator.min.css" rel="stylesheet">
</head>
<body>

    <h1>Earthquake Shelter Locator</h1>

    <div id="map"></div>

    <div class="card">
        <h2>Earthquake Information</h2>

        <p id="magnitude">Magnitude: --</p>
        <p id="location">Location: --</p>
        <p id="latitude">Latitude: --</p>
        <p id="longitude">Longitude: --</p>
        <p id="time">Time: --</p>
    </div>

    <div class="card">
        <h2>Nearby Shelters</h2>

        <table>
            <thead>
                <tr>
                    <th>Shelter Name</th>
                    <th>Distance (mi)</th>
                </tr>
            </thead>

            <tbody id="shelterTable">
                <tr>
                    <td>Waiting for data...</td>
                    <td>-</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div>
        <label for="submitLatitude">Latitude:</label>
        <input type="text" id="submitLatitude" name="submitLatitude" placeholder="">
        <label for="submitLongitude">Longitude:</label>
        <input type="text" id="submitLongitude" name="submitLongitude" placeholder="">

        <button id="submitLocation">Submit</button>
    </div>

    <div id="earthquake-table"></div>

    <div id="shelter-table"></div>

    <button id="refreshButton">
        Refresh Data
    </button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/tabulator-tables/dist/js/tabulator.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
